# Rebuilds the site (docs/) whenever content, photos or code change on main, for example after
# "Publish" in the admin panel, and commits the result. GitHub Pages serves docs/ from main.
name: Build site

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-site
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build
        run: node src/build.mjs
      - name: Commit the built site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          if git diff --cached --quiet; then
            echo "docs/ is already up to date"
            exit 0
          fi
          git commit -m "Build site"
          # A newer admin commit may have landed meanwhile; it starts its own build, so just rebase onto it.
          git pull --rebase origin main
          git push origin HEAD:main
